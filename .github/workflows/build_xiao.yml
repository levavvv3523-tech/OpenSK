name: Build Zephyr FIDO2 Key for XIAO nRF52840

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install Zephyr dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git cmake ninja-build gperf ccache dfu-util device-tree-compiler wget python3-dev python3-pip python3-setuptools python3-tk python3-wheel xz-utils file make gcc gcc-multilib g++-multilib libsdl2-dev libmagic1
          python3 -m pip install --upgrade pip west

      - name: Initialize Zephyr workspace
        run: |
          REPO=$(echo "aHR0cHM6Ly9naXRodWIuY29tL3plcGh5cnByb2plY3QtcnRvcy96ZXBoeXI=" | base64 -d)
          west init -m "$REPO" --mr main zephyrproject
          cd zephyrproject
          west update --narrow -o=--depth=1
          west zephyr-export
          python3 -m pip install -r zephyr/scripts/requirements.txt

      - name: Install Zephyr SDK
        run: |
          SDK_URL=$(echo "aHR0cHM6Ly9naXRodWIuY29tL3plcGh5cnByb2plY3QtcnRvcy9zZGstbmcvcmVsZWFzZXMvZG93bmxvYWQvdjAuMTcuMC96ZXBoeXItc2RrLTAuMTcuMF9saW51eC14ODZfNjRfbWluaW1hbC50YXIueHo=" | base64 -d)
          wget -q "$SDK_URL" -O sdk.tar.xz
          sudo tar -xf sdk.tar.xz -C /opt
          sudo /opt/zephyr-sdk-0.17.0/setup.sh -t arm-zephyr-eabi -c

      - name: Configure Button D0 and Build UF2
        run: |
          cd zephyrproject/zephyr
          SAMPLE_DIR="samples/subsys/authentication/fido2"
          mkdir -p "$SAMPLE_DIR/boards"
          cat << 'EOF' > "$SAMPLE_DIR/boards/xiao_ble.overlay"
          / {
            aliases {
              sw0 = &fido_btn;
              led0 = &led1;
            };
            buttons {
              compatible = "gpio-keys";
              fido_btn: button_0 {
                gpios = <&gpio0 2 (GPIO_PULL_UP | GPIO_ACTIVE_LOW)>;
                label = "User Presence Button";
              };
            };
          };
          EOF
          west build -p always -b xiao_ble "$SAMPLE_DIR"
          cp build/zephyr/zephyr.uf2 ../../xiao_fido2_key.uf2

      - name: Upload Ready UF2 File
        uses: actions/upload-artifact@v4
        with:
          name: xiao_fido2_key
          path: xiao_fido2_key.uf2
