name: Build firmware

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-firmware:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout OpenSK repository
        uses: actions/checkout@v4
        with:
          repository: google/OpenSK
          ref: develop
          submodules: true
          path: OpenSK
      - name: Install Rust toolchain
        run: rustup show
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip setuptools wheel colorama tqdm pyyaml
      - name: Set up OpenSK and Configure Button D1
        working-directory: OpenSK
        run: |
          ./setup.sh
          find . -path "*nrf52840*" -name "*.rs" -exec sed -i 's/P0_18/P0_03/g; s/P1_06/P0_03/g; s/P1_00/P0_03/g' {} +
      - name: Building board nrf52840_mdk for XIAO
        working-directory: OpenSK
        run: |
          ./flash.sh nrf52840_mdk || true
          HEX_FILE=$(find . -name "platform.hex" | head -n 1)
          python3 third_party/wasefire/.root/bin/uf2conv.py -c -f 0xADA52840 -o opensk_xiao_d1.uf2 "$HEX_FILE"
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: opensk_xiao_d1
          path: OpenSK/opensk_xiao_d1.uf2
