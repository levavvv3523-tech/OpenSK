name: Build firmware

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-firmware:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout OpenSK repository
        uses: actions/checkout@v4
        with:
          repository: google/OpenSK
          ref: develop
          submodules: true
          path: OpenSK
      - name: Get the version
        id: get_version
        working-directory: OpenSK
        run: echo "VERSION=$(git describe --always --tags)" >> $GITHUB_OUTPUT
      - name: Install Rust toolchain
        run: rustup show
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel colorama tqdm pyyaml
          python -m pip install --pre -U git+https://github.com
      - name: Set up OpenSK and Configure XIAO nRF52840
        working-directory: OpenSK
        run: |
          ./setup.sh
          cp -r boards/nrf52840_mdk_dfu boards/xiao_nrf52840
          sed -i 's/nrf52840_mdk_dfu/xiao_nrf52840/g' boards/xiao_nrf52840/Cargo.toml boards/xiao_nrf52840/build.rs boards/xiao_nrf52840/src/main.rs boards/xiao_nrf52840/layout.ld || true
          sed -i 's/0x00027000/0x00001000/g; s/0x27000/0x1000/g' boards/xiao_nrf52840/layout.ld || true
          sed -i 's/Pin::P0_18/Pin::P0_03/g' boards/xiao_nrf52840/src/main.rs
      - name: Building board xiao_nrf52840
        working-directory: OpenSK
        run: |
          ./deploy.py --board=xiao_nrf52840 --opensk --programmer=none
          uf2conv -c -f 0xada52840 -o target/opensk-xiao_nrf52840-${{ steps.get_version.outputs.VERSION }}.uf2 target/xiao_nrf52840_merged.hex
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: opensk-firmware-${{ steps.get_version.outputs.VERSION }}
          path: |
            OpenSK/target/opensk-xiao_nrf52840-${{ steps.get_version.outputs.VERSION }}.uf2
