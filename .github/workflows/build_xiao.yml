name: Build Valid FIDO2 Key for XIAO nRF52840

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OpenSK
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip libssl-dev pkg-config wget uuid-runtime

      - name: Setup OpenSK toolchain
        run: ./setup.sh

      - name: Configure XIAO nRF52840 pins (Button D0 / P0.02 + RGB LEDs)
        run: |
          MAIN_RS="third_party/tock/boards/nordic/nrf52840_dongle/src/main.rs"
          # Кнопка підтвердження присутності (User Presence) на пін D0 (P0.02)
          sed -i 's/Pin::P1_06/Pin::P0_02/g' "$MAIN_RS"
          # Вбудовані світлодіоди XIAO (Зелений P0.30, Червоний P0.26, Синій P0.06)
          sed -i 's/Pin::P0_08/Pin::P0_30/g' "$MAIN_RS"
          sed -i 's/Pin::P1_09/Pin::P0_26/g' "$MAIN_RS"
          sed -i 's/Pin::P0_12/Pin::P0_06/g' "$MAIN_RS"

      - name: Fix Flash Memory Map for XIAO Bootloader (Protect 0xF4000+)
        run: |
          LAYOUT_LD="third_party/tock/boards/nordic/nrf52840_dongle/layout.ld"
          # Старт ядра з 0x27000 (після SoftDevice XIAO), кінець перед завантажувачем 0xF4000
          cat << 'EOF' > "$LAYOUT_LD"
          MEMORY
          {
            rom (rx)  : ORIGIN = 0x00027000, LENGTH = 0x00019000
            prog (rx) : ORIGIN = 0x00040000, LENGTH = 0x000A0000
            ram (rwx) : ORIGIN = 0x20000000, LENGTH = 0x00040000
          }
          INCLUDE ../kernel_layout.ld
          EOF

      - name: Generate Attestation Certificates & Build FIDO2 Firmware
        run: |
          # Генеруємо криптографічні сертифікати атестації, щоб Windows та браузери прийняли ключ
          ./tools/gen_key_materials.sh --force || true
          # Збираємо прошивку з підтримкою CTAP2 / FIDO2 HID
          ./deploy.py --board=nrf52840_dongle --opensk --programmer=none

      - name: Package into UF2 for XIAO
        run: |
          wget -q https://githubusercontent.com
          wget -q https://githubusercontent.com
          HEX_FILE=$(find target -name "*merged*.hex" | head -n 1)
          echo "Packing $HEX_FILE..."
          python3 uf2conv.py -c -f 0xADA52840 -o xiao_fido2_key.uf2 "$HEX_FILE"

      - name: Upload FIDO2 UF2 Firmware
        uses: actions/upload-artifact@v4
        with:
          name: xiao_fido2_key
          path: xiao_fido2_key.uf2

