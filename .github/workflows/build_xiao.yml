name: Build FIDO2 Key XIAO nRF52840

on:
  workflow_dispatch:

env:
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout OpenSK
        uses: actions/checkout@v4
        with:
          repository: google/OpenSK
          ref: ctap2.0
          fetch-depth: 0
          submodules: recursive

      - name: Install tools
        run: |
          sudo ln -sf /bin/bash /bin/sh
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip libssl-dev pkg-config uuid-runtime git libudev-dev
          rustup --version

      - name: Setup OpenSK
        env:
          TERM: xterm
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          chmod +x setup.sh
          ./setup.sh

      - name: Patch XIAO pins and memory
        run: |
          M="third_party/tock/boards/nordic/nrf52840_dongle/src/main.rs"
          L="third_party/tock/boards/nordic/nrf52840_dongle/layout.ld"
          sed -i 's/Pin::P1_06/Pin::P0_02/g' "$M"
          sed -i 's/Pin::P0_08/Pin::P0_30/g' "$M"
          sed -i 's/Pin::P1_09/Pin::P0_26/g' "$M"
          sed -i 's/Pin::P0_12/Pin::P0_06/g' "$M"
          sed -i 's/0x00001000/0x00027000/g' "$L"
          sed -i 's/0x00030000/0x00019000/g' "$L"
          sed -i 's/0x00031000/0x00040000/g' "$L"

      - name: Build firmware
        run: |
          python3 ./deploy.py --board=nrf52840_dongle_dfu --opensk --programmer=none

      - name: Make UF2 file
        run: |
          git clone --depth 1 https://github.com uf2_tool
          HEX=$(find target -name "*merged*.hex" | head -n 1)
          python3 uf2_tool/utils/uf2conv.py -c -f 0xADA52840 -o xiao_fido2_key.uf2 "$HEX"

      - name: Upload UF2
        uses: actions/upload-artifact@v4
        with:
          name: xiao_fido2_key
          path: xiao_fido2_key.uf2
