name: Build firmware

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-firmware:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout OpenSK repository
        uses: actions/checkout@v4
        with:
          repository: google/OpenSK
          ref: develop
          submodules: true
          path: OpenSK
      - name: Install Rust toolchain
        run: rustup show
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip setuptools wheel colorama tqdm pyyaml
      - name: Set up OpenSK and Configure XIAO nRF52840
        working-directory: OpenSK
        run: |
          ./setup.sh
          find . -maxdepth 4 -name "main.rs" -exec sed -i 's/Pin::P0_18/Pin::P0_03/g; s/Pin::P1_06/Pin::P0_03/g' {} +
          find . -maxdepth 4 -name "layout.ld" -exec sed -i 's/0x00027000/0x00001000/g; s/0x27000/0x1000/g' {} +
      - name: Building board nrf52840_mdk for XIAO
        working-directory: OpenSK
        run: |
          mkdir -p fake_bin
          for cmd in probe-rs nrfjprog nrfutil uf2conv; do printf '#!/bin/sh\nexit 0\n' > fake_bin/$cmd && chmod +x fake_bin/$cmd; done
          PATH="$PWD/fake_bin:$PATH" ./flash.sh nrf52840_mdk
          python3 -c '
          import struct, glob
          bins = [f for f in glob.glob("**/target/**/*opensk*", recursive=True) if not f.endswith((".d", ".rlib", ".rmeta", ".o", ".hex", ".uf2"))]
          bins.sort(key=lambda x: len(open(x, "rb").read()), reverse=True)
          data = open(bins[0], "rb").read()
          out = bytearray()
          blocks = (len(data) + 255) // 256
          for i in range(blocks):
              chunk = data[i*256:(i+1)*256].ljust(256, b"\x00")
              hdr = struct.pack("<IIIIIIII", 0x0A324655, 0x9E5D5157, 0x00002000, 0x00001000 + i*256, 256, i, blocks, 0xADA52840)
              out += hdr + chunk + b"\x00"*220 + struct.pack("<I", 0x0AB16F30)
          open("opensk_xiao_d1.uf2", "wb").write(out)
          '
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: opensk_xiao_d1
          path: OpenSK/opensk_xiao_d1.uf2
