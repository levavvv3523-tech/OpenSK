name: Build XIAO nRF52840 OpenSK UF2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip libssl-dev pkg-config wget

      - name: Setup OpenSK environment
        run: ./setup.sh

      - name: Patch pins for Seeed XIAO nRF52840 (Button on D0 / P0.02)
        run: |
          MAIN_RS="third_party/tock/boards/nordic/nrf52840_dongle/src/main.rs"
          # Переносимо кнопку підтвердження на пін D0 (P0_02)
          sed -i 's/Pin::P1_06/Pin::P0_02/g' "$MAIN_RS"
          # Переносимо світлодіоди на RGB LED плати XIAO (Червоний P0_26, Зелений P0_30, Синій P0_06)
          sed -i 's/Pin::P0_08/Pin::P0_30/g' "$MAIN_RS"
          sed -i 's/Pin::P1_09/Pin::P0_26/g' "$MAIN_RS"
          sed -i 's/Pin::P0_12/Pin::P0_06/g' "$MAIN_RS"

      - name: Patch memory layout for XIAO UF2 Bootloader (0x27000)
        run: |
          LAYOUT_LD="third_party/tock/boards/nordic/nrf52840_dongle/layout.ld"
          sed -i 's/ORIGIN = 0x00001000, LENGTH = 0x00030000/ORIGIN = 0x00027000, LENGTH = 0x00019000/g' "$LAYOUT_LD"
          sed -i 's/ORIGIN = 0x00031000/ORIGIN = 0x00040000/g' "$LAYOUT_LD"

      - name: Build OpenSK firmware
        run: ./deploy.py --board=nrf52840_dongle --opensk --programmer=none

      - name: Convert HEX to UF2
        run: |
          wget https://githubusercontent.com
          wget https://githubusercontent.com
          HEX_FILE=$(find target -name "*merged*.hex" | head -n 1)
          python3 uf2conv.py -c -f 0xADA52840 -o xiao_opensk.uf2 "$HEX_FILE"

      - name: Upload UF2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiao_opensk_firmware
          path: xiao_opensk.uf2
