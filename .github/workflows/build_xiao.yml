name: Build FIDO2 Key XIAO nRF52840

on:
  workflow_dispatch:

env:
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout OpenSK ctap2.0
        uses: actions/checkout@v4
        with:
          repository: google/OpenSK
          ref: ctap2.0
          fetch-depth: 0
          submodules: recursive

      - name: Install tools
        run: |
          sudo ln -sf /bin/bash /bin/sh
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip libssl-dev pkg-config uuid-runtime git libudev-dev binutils-arm-none-eabi
          rustup toolchain install stable

      - name: Setup OpenSK
        env:
          TERM: xterm
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          sed -i 's/cargo install/cargo +stable install --locked/g' setup.sh deploy.py
          chmod +x setup.sh
          ./setup.sh

      - name: Patch XIAO pins and memory
        run: |
          for M in third_party/tock/boards/nordic/nrf52840_dongle*/src/main.rs; do
            sed -i 's/Pin::P1_06/Pin::P0_02/g; s/Pin::P0_08/Pin::P0_30/g; s/Pin::P1_09/Pin::P0_26/g; s/Pin::P0_12/Pin::P0_06/g' "$M"
          done
          for L in third_party/tock/boards/nordic/nrf52840_dongle*/layout.ld; do
            sed -i 's/ORIGIN = 0x00001000, LENGTH = 0x00030000/ORIGIN = 0x00027000, LENGTH = 0x00019000/g' "$L"
            sed -i 's/ORIGIN = 0x00026000, LENGTH = 0x0001A000/ORIGIN = 0x00027000, LENGTH = 0x00019000/g' "$L"
            sed -i 's/ORIGIN = 0x00031000/ORIGIN = 0x00040000/g' "$L"
          done

      - name: Build firmware with auto-patch
        run: |
          for i in {1..15}; do
            find /home/runner/.cargo -type f -name "Cargo.toml" -exec sed -i -E 's/edition[[:space:]]*=[[:space:]]*"202[0-9]"/edition = "2018"/g' {} + 2>/dev/null || true
            if python3 ./deploy.py --board=nrf52840_dongle_dfu --opensk --programmer=none; then
              break
            fi
          done

      - name: Make UF2 file
        run: |
          find . -maxdepth 5 -type f \( -name "*.hex" -o -name "*.bin" -o -name "*.tab" -o -name "nrf52840_dongle_dfu" -o -name "ctap2" \)
          KERNEL_ELF=$(find third_party/tock -path "*thumbv7em-none-eabi/release/nrf52840_dongle_dfu" -type f | head -n 1)
          APP_TAB=$(find target -name "*.tab" -type f | head -n 1)
          arm-none-eabi-objcopy -O binary "$KERNEL_ELF" kernel.bin
          tar -xf "$APP_TAB"
          APP_BIN=$(find . -maxdepth 1 -name "*.bin" ! -name "kernel.bin" | head -n 1)
          python3 -c '
          import struct
          k = open("kernel.bin", "rb").read()
          a = open("'"$APP_BIN"'", "rb").read()
          parts = [(0x00027000 + i, k[i:i+256].ljust(256, b"\xff")) for i in range(0, len(k), 256)]
          parts += [(0x00040000 + i, a[i:i+256].ljust(256, b"\xff")) for i in range(0, len(a), 256)]
          with open("xiao_fido2_key.uf2", "wb") as out:
              for idx, (addr, chunk) in enumerate(parts):
                  hdr = struct.pack("<IIIIIIII", 0x0A324655, 0x9E5D5157, 0x00002000, addr, 256, idx, len(parts), 0xADA52840)
                  out.write(hdr + chunk + b"\x00"*220 + struct.pack("<I", 0x0AB16F30))
          print("Created xiao_fido2_key.uf2 with", len(parts), "blocks")
          '

      - name: Upload UF2
        uses: actions/upload-artifact@v4
        with:
          name: xiao_fido2_key
          path: xiao_fido2_key.uf2
