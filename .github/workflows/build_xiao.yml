name: Build FIDO2 Key XIAO nRF52840

on:
  workflow_dispatch:

env:
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout OpenSK ctap2.0
        uses: actions/checkout@v4
        with:
          repository: google/OpenSK
          ref: ctap2.0
          fetch-depth: 0
          submodules: recursive

      - name: Install tools
        run: |
          sudo ln -sf /bin/bash /bin/sh
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip libssl-dev pkg-config uuid-runtime git libudev-dev
          rustup toolchain install stable

      - name: Setup OpenSK
        env:
          TERM: xterm
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          sed -i 's/cargo install/cargo +stable install --locked/g' setup.sh deploy.py
          chmod +x setup.sh
          ./setup.sh

      - name: Patch XIAO pins and memory
        run: |
          for M in third_party/tock/boards/nordic/nrf52840_dongle*/src/main.rs; do
            sed -i 's/Pin::P1_06/Pin::P0_02/g; s/Pin::P0_08/Pin::P0_30/g; s/Pin::P1_09/Pin::P0_26/g; s/Pin::P0_12/Pin::P0_06/g' "$M"
          done
          for L in third_party/tock/boards/nordic/nrf52840_dongle*/layout.ld; do
            sed -i 's/ORIGIN = 0x00001000, LENGTH = 0x00030000/ORIGIN = 0x00027000, LENGTH = 0x00019000/g' "$L"
            sed -i 's/ORIGIN = 0x00026000, LENGTH = 0x0001A000/ORIGIN = 0x00027000, LENGTH = 0x00019000/g' "$L"
            sed -i 's/ORIGIN = 0x00031000/ORIGIN = 0x00040000/g' "$L"
          done

      - name: Build firmware with auto-patch
        run: |
          for i in {1..15}; do
            find /home/runner/.cargo -type f -name "Cargo.toml" -exec sed -i -E 's/edition[[:space:]]*=[[:space:]]*"202[0-9]"/edition = "2018"/g' {} + 2>/dev/null || true
            if python3 ./deploy.py --board=nrf52840_dongle_dfu --opensk --programmer=none; then
              break
            fi
          done

      - name: Make UF2 file
        run: |
          python3 - << 'EOF'
          import glob, struct
          hex_file = glob.glob("target/**/*merged*.hex", recursive=True)[0]
          mem, upper = {}, 0
          for line in open(hex_file):
              if not line.startswith(":"): continue
              b = bytes.fromhex(line[1:].strip())
              cnt, addr, rtype, data = b[0], (b[1]<<8)|b[2], b[3], b[4:-1]
              if rtype == 0:
                  for i, v in enumerate(data): mem[upper + addr + i] = v
              elif rtype == 4:
                  upper = ((data[0]<<8)|data[1]) << 16
          addrs = sorted(mem)
          blocks = []
          for base in range(addrs[0] & ~255, addrs[-1] + 1, 256):
              chunk = bytes(mem.get(base + i, 0xFF) for i in range(256))
              if any(x != 0xFF for x in chunk): blocks.append((base, chunk))
          with open("xiao_fido2_key.uf2", "wb") as f:
              for idx, (addr, chunk) in enumerate(blocks):
                  hdr = struct.pack("<IIIIIIII", 0x0A324655, 0x9E5D5157, 0x00002000, addr, 256, idx, len(blocks), 0xADA52840)
                  f.write(hdr + chunk + b"\x00"*220 + struct.pack("<I", 0x0AB16F30))
          print(f"Packed {len(blocks)} blocks into xiao_fido2_key.uf2")
          EOF

      - name: Upload UF2
        uses: actions/upload-artifact@v4
        with:
          name: xiao_fido2_key
          path: xiao_fido2_key.uf2
