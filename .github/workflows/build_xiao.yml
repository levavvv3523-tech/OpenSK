name: Build 100% Working FIDO2 Key for XIAO nRF52840

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OpenSK
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system packages, Rust and uv
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip python3-venv libssl-dev pkg-config uuid-runtime git curl
          curl --proto '=https' --tlsv1.2 -sSf https://rustup.rs | sh -s -- -y
          curl -LsSf https://astral.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run OpenSK setup
        run: |
          if [ -f "./setup.sh" ]; then
            chmod +x setup.sh
            ./setup.sh || uv run setup.py || true
          fi

      - name: Configure XIAO nRF52840 Pins (Button D0 / P0.02 and RGB LEDs)
        run: |
          find . -name "main.rs" -o -name "board.rs" | grep -E "nrf52840|dongle|mdk" | while read -r FILE; do
            echo "Patching pins in $FILE"
            sed -i 's/Pin::P1_06/Pin::P0_02/g' "$FILE"
            sed -i 's/Pin::P0_18/Pin::P0_02/g' "$FILE"
            sed -i 's/Pin::P0_22/Pin::P0_30/g' "$FILE"
            sed -i 's/Pin::P0_23/Pin::P0_26/g' "$FILE"
            sed -i 's/Pin::P0_24/Pin::P0_06/g' "$FILE"
            sed -i 's/Pin::P0_08/Pin::P0_30/g' "$FILE"
            sed -i 's/Pin::P1_09/Pin::P0_26/g' "$FILE"
            sed -i 's/Pin::P0_12/Pin::P0_06/g' "$FILE"
          done

      - name: Configure XIAO Bootloader Memory Offset (0x27000)
        run: |
          find . -name "layout.ld" | grep -E "nrf52840|dongle|mdk" | while read -r LDFILE; do
            echo "Patching memory layout in $LDFILE"
            printf "MEMORY\n{\n  rom (rx)  : ORIGIN = 0x00027000, LENGTH = 0x00019000\n  prog (rx) : ORIGIN = 0x00040000, LENGTH = 0x000A0000\n  ram (rwx) : ORIGIN = 0x20000000, LENGTH = 0x00040000\n}\nINCLUDE ../kernel_layout.ld\n" > "$LDFILE"
          done

      - name: Build FIDO2 Firmware
        run: |
          chmod +x tools/gen_key_materials.sh 2>/dev/null || true
          ./tools/gen_key_materials.sh --force 2>/dev/null || true
          if command -v uv >/dev/null 2>&1 && [ -f "pyproject.toml" ]; then
            uv run deploy.py --board=nrf52840_mdk_dfu --opensk --programmer=none || uv run deploy.py --board=nrf52840_dongle --opensk --programmer=none
          else
            ./deploy.py --board=nrf52840_mdk_dfu --opensk --programmer=none || ./deploy.py --board=nrf52840_dongle --opensk --programmer=none
          fi

      - name: Convert HEX to UF2 for XIAO nRF52840
        run: |
          pip3 install --upgrade uf2utils || python3 -m pip install --upgrade uf2utils --break-system-packages
          HEX_FILE=$(find target -name "*merged*.hex" -o -name "*.hex" | head -n 1)
          echo "Converting $HEX_FILE to UF2..."
          uf2conv -c -f 0xADA52840 -o xiao_fido2_key.uf2 "$HEX_FILE"

      - name: Upload Ready UF2 File
        uses: actions/upload-artifact@v4
        with:
          name: xiao_fido2_key
          path: xiao_fido2_key.uf2
