name: Build OpenSK FIDO2 Key for XIAO nRF52840

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl python3-pip libssl-dev pkg-config libudev-dev
          rustup default stable
          python3 -m pip install --upgrade pip colorama tqdm pyyaml

      - name: Clone OpenSK with XIAO nRF52840 support
        run: |
          REPO=$(echo "aHR0cHM6Ly9naXRodWIuY29tL2dvb2dsZS9PcGVuU0suZ2l0" | base64 -d)
          git clone --recursive "$REPO" opensk_src
          cd opensk_src
          ./setup.sh

      - name: Configure XIAO nRF52840 (Button D1, No Heating)
        run: |
          cd opensk_src
          cp -r boards/nrf52840_dongle_dfu boards/xiao_nrf52840
          sed -i 's/nrf52840_dongle_dfu/xiao_nrf52840/g' boards/xiao_nrf52840/Cargo.toml boards/xiao_nrf52840/build.rs boards/xiao_nrf52840/src/main.rs || true
          sed -i 's/Pin::P1_06/Pin::P0_03/g' boards/xiao_nrf52840/src/main.rs
          sed -i 's/Pin::P0_06/Pin::P0_26/g' boards/xiao_nrf52840/src/main.rs
          sed -i 's/Pin::P0_08/Pin::P0_30/g' boards/xiao_nrf52840/src/main.rs
          sed -i 's/Pin::P1_09/Pin::P0_06/g' boards/xiao_nrf52840/src/main.rs
          sed -i 's/Pin::P0_12/Pin::P0_26/g' boards/xiao_nrf52840/src/main.rs

      - name: Build UF2 Firmware
        run: |
          cd opensk_src
          ./deploy.py --board=xiao_nrf52840 --opensk --programmer=none
          python3 -c '
          import struct
          data = open("target/xiao_nrf52840_opensk.bin", "rb").read()
          out = bytearray()
          blocks = (len(data) + 255) // 256
          for i in range(blocks):
              chunk = data[i*256:(i+1)*256].ljust(256, b"\x00")
              hdr = struct.pack("<IIIIIIII", 0x0A324655, 0x9E5D5157, 0x00002000, 0x00001000 + i*256, 256, i, blocks, 0xADA52840)
              out += hdr + chunk + b"\x00"*(476-256) + struct.pack("<I", 0x0AB16F30)
          open("../opensk_xiao.uf2", "wb").write(out)
          '

      - name: Upload Ready UF2 File
        uses: actions/upload-artifact@v4
        with:
          name: opensk_xiao
          path: opensk_xiao.uf2
